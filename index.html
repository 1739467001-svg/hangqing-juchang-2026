<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090f">
<meta name="build" content="v1.1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行情剧场">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230a0e18'/%3E%3Crect%20x='18'%20y='12'%20width='2'%20height='40'%20fill='%23ff3b5c'/%3E%3Crect%20x='13'%20y='20'%20width='12'%20height='24'%20fill='%23ff3b5c'/%3E%3Crect%20x='44'%20y='14'%20width='2'%20height='36'%20fill='%2300e676'/%3E%3Crect%20x='39'%20y='26'%20width='12'%20height='18'%20fill='%2300e676'/%3E%3C/svg%3E">
<title>行情剧场 · 交易人格试炼</title>
<style>
:root{
  --bg:#07090f; --panel:rgba(17,23,40,.72);
  --ink:#e9edf6; --dim:rgba(233,237,246,.5);
  --up:#ff3b5c; --down:#00e676; --gold:#ffd166; --violet:#8b7bff;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:contain;
}
/* 舞台氛围：光斑 + 扫描线 + 暗角 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 560px at 50% -12%,rgba(139,123,255,.13),transparent 60%),
    radial-gradient(880px 520px at 108% 108%,rgba(255,59,92,.11),transparent 55%),
    radial-gradient(700px 420px at -12% 88%,rgba(0,230,118,.08),transparent 55%);}
body::after{content:"";position:fixed;inset:0;z-index:70;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .18s}
#fx.flashUp{background:rgba(255,59,92,.14)} #fx.flashDown{background:rgba(0,230,118,.11)}
#confetti{position:fixed;inset:0;z-index:65;pointer-events:none}
#danmaku{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:470px;
  z-index:30;pointer-events:none;overflow:hidden}
.dm{position:absolute;white-space:nowrap;font-weight:700;color:rgba(233,237,246,.66);
  text-shadow:0 0 10px rgba(233,237,246,.25);animation:dmk linear forwards}
@keyframes dmk{from{transform:translateX(480px)}to{transform:translateX(-180px)}}

#stage{position:relative;z-index:2;max-width:470px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px);
  display:flex;flex-direction:column;gap:12px}
#atmo{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background 1.2s ease}
.spark{width:56px;height:20px;flex:none;opacity:.95}
.ecv{width:100%;height:76px;display:block;margin:12px 0 2px}
#stage.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.card{background:var(--panel);border:1px solid rgba(255,255,255,.09);border-radius:var(--r);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fadeUp{animation:fu .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pp .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pp{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* 顶部栏 */
.top{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);transition:.3s}
.dot.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dot.done{background:rgba(255,209,102,.35)}
.eq{font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;color:var(--gold);
  text-shadow:0 0 12px rgba(255,209,102,.35)}
.mute{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:var(--ink);font-size:14px;cursor:pointer}

/* 按钮 */
.btn{position:relative;display:block;width:100%;border:0;border-radius:14px;padding:15px;
  font-size:17px;font-weight:800;letter-spacing:.14em;color:#fff;cursor:pointer;overflow:hidden;
  background:linear-gradient(135deg,#ff3b5c,#a50f30);
  box-shadow:0 8px 28px rgba(255,59,92,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.gold{background:linear-gradient(135deg,#ffd166,#c9861a);color:#241a00;
  box-shadow:0 8px 28px rgba(255,209,102,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  box-shadow:none;color:var(--ink);font-weight:600;letter-spacing:.06em}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-18deg);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:135%}}
.btn:active{transform:scale(.98)}

/* 图表卡 */
.chartHead{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.act{font-size:12px;font-weight:900;letter-spacing:.14em;color:#1a1200;
  background:linear-gradient(135deg,var(--gold),#c9861a);padding:4px 14px;border-radius:3px;
  clip-path:polygon(0 0,100% 0,100% calc(50% - 4px),calc(100% - 5px) 50%,100% calc(50% + 4px),100% 100%,0 100%,5px 50%,0 calc(50% - 4px));
  box-shadow:0 0 12px rgba(255,209,102,.35)}
.chip{font-size:11px;color:var(--dim);border:1px solid rgba(255,255,255,.14);
  padding:2px 8px;border-radius:999px}
.chip.real{color:var(--gold);border-color:rgba(255,209,102,.4);font-weight:700}
.spacer{flex:1}
#kcv{display:block;width:100%;height:170px;padding:0 8px 8px}
.drama{padding:12px 14px;font-size:13.5px;line-height:1.75;color:var(--dim);
  border-left:3px solid var(--gold);margin:0 10px 12px;border-radius:6px;
  background:linear-gradient(90deg,rgba(255,209,102,.07),transparent)}

/* 决策区 */
.qrow{display:flex;align-items:center;gap:12px;margin-top:2px}
.q{flex:1;font-size:19px;font-weight:900;line-height:1.5}
.ringbox{position:relative;width:56px;height:56px;flex:none}
.ring{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.rbg{stroke:rgba(255,255,255,.09)}
.rfg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:163.36;transition:stroke .3s}
.ringbox.hot .rfg{stroke:var(--up);animation:pl .8s infinite}
.ringbox.hot .rsec{color:var(--up)}
@keyframes pl{0%,100%{filter:drop-shadow(0 0 3px rgba(255,59,92,.6))}50%{filter:drop-shadow(0 0 12px rgba(255,59,92,.95))}}
.rsec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{position:relative;text-align:left;padding:14px 16px;font-size:15.5px;font-weight:700;
  line-height:1.45;color:var(--ink);cursor:pointer;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);transition:transform .12s, border-color .2s}
.opt::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:2px;
  background:var(--mood,var(--gold));opacity:.5;transition:opacity .3s}
.opt:active{transform:scale(.97);border-color:var(--gold)}
.opt .k{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;
  margin-right:9px;border-radius:7px;font-size:12px;font-weight:900;color:#1a1200;
  background:linear-gradient(135deg,var(--gold),#c9861a);vertical-align:1px}
.combo{align-self:center;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:.1em;
  text-shadow:0 0 12px rgba(255,209,102,.5)}

/* 飘字 */
.float{position:fixed;z-index:55;font-weight:900;font-size:26px;pointer-events:none;
  left:50%;transform:translateX(-50%);animation:flt 1.15s ease-out forwards}
.float.pos{color:var(--up);text-shadow:0 0 16px rgba(255,59,92,.75)}
.float.neg{color:var(--down);text-shadow:0 0 16px rgba(0,230,118,.6)}
.float.xp{color:var(--violet);text-shadow:0 0 16px rgba(139,123,255,.7);font-size:21px}
@keyframes flt{0%{opacity:0;translate:0 18px;scale:.7}12%{opacity:1;scale:1.15}
  25%{scale:1}100%{opacity:0;translate:0 -86px}}

/* 开场 */
.hero{margin-top:8vh;text-align:center}
.tagEn{font-size:11px;letter-spacing:.5em;color:var(--dim);font-weight:700}
h1.logo{margin:10px 0 2px;font-size:clamp(46px,13vw,64px);font-weight:900;letter-spacing:.06em;
  background:linear-gradient(120deg,#ffd166 15%,#ff3b5c 60%,#8b7bff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,59,92,.35))}
.sub{font-size:15px;font-weight:800;letter-spacing:.42em;color:var(--ink);text-indent:.42em}
.slog{margin-top:14px;font-size:12.5px;color:var(--dim);letter-spacing:.08em}
.bank{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 18px;
  border-radius:999px;border:1px solid rgba(255,209,102,.4);color:var(--gold);
  font-weight:900;font-size:14px;background:rgba(255,209,102,.07)}
.pgrid{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.pgrid span{font-weight:900;font-size:13px;padding:7px 13px;border-radius:999px;
  border:1px solid currentColor;box-shadow:0 0 16px -6px currentColor;letter-spacing:.06em}
.pnote{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:.14em}
.ticker{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6px);z-index:5;
  overflow:hidden;font-size:11px;color:var(--dim);border-top:1px solid rgba(255,255,255,.06);padding:6px 0}
.ticker span{display:inline-block;padding-right:26px;animation:dmk 26s linear infinite}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:1;pointer-events:none}
.orb1{width:260px;height:260px;left:-70px;top:12%;background:rgba(255,59,92,.32);animation:of 9s ease-in-out infinite alternate}
.orb2{width:300px;height:300px;right:-90px;top:44%;background:rgba(139,123,255,.3);animation:of 11s ease-in-out infinite alternate-reverse}
@keyframes of{from{transform:translateY(-24px)}to{transform:translateY(26px)}}
.disc{font-size:10.5px;color:rgba(233,237,246,.32);text-align:center;line-height:1.6}

/* 结算 */
.reveal{perspective:900px;text-align:center;margin-top:6px}
.pcard{position:relative;border-radius:20px;padding:22px 18px 18px;
  background:linear-gradient(165deg,rgba(30,22,10,.92),rgba(17,23,40,.92) 55%);
  border:1px solid rgba(255,209,102,.55);
  box-shadow:0 0 42px rgba(255,209,102,.22),0 20px 60px rgba(0,0,0,.6);
  animation:flip .8s cubic-bezier(.2,1.1,.35,1) both;transform-style:preserve-3d;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.12) 44%,rgba(139,123,255,.20) 50%,rgba(255,209,102,.15) 56%,transparent 68%);
  background-size:260% 260%;animation:holo 3.4s linear infinite}
@keyframes holo{0%{background-position:130% -20%}100%{background-position:-45% 110%}}
.stars{font-size:12px;letter-spacing:.5em;color:var(--gold);margin:6px 0 2px;
  text-shadow:0 0 10px rgba(255,209,102,.6)}
.serial{position:absolute;right:14px;bottom:10px;font-size:10px;color:rgba(233,237,246,.45);
  font-variant-numeric:tabular-nums;letter-spacing:.08em}
.vsline{margin-top:7px;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.04em;min-height:1em}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;
  border:1px solid rgba(255,209,102,.4);color:var(--gold);background:rgba(255,209,102,.07)}
.bdg.dim{border-color:rgba(255,255,255,.15);color:var(--dim);background:transparent}
.ending{padding:12px 16px}
.ending .et{font-size:17px;font-weight:900;color:var(--gold)}
.ending .ed{font-size:12.5px;color:var(--dim);margin-top:3px}
.wf,.wr{position:absolute;border-radius:2px;will-change:transform;opacity:.85}
.wf{top:-8%;animation:wfall linear forwards}
.wr{bottom:-8%;animation:wrise linear forwards}
@keyframes wfall{to{transform:translateY(118vh) rotate(26deg);opacity:0}}
@keyframes wrise{to{transform:translateY(-114vh) rotate(-20deg);opacity:0}}
#atmo{overflow:hidden}
.live{position:fixed;top:0;left:0;width:100vw;height:32vh;opacity:.4;pointer-events:none;z-index:0}
@keyframes flip{from{opacity:0;transform:rotateY(70deg) scale(.8)}to{opacity:1;transform:none}}
.rarity{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:900;letter-spacing:.3em;color:#1a1200;white-space:nowrap;
  background:linear-gradient(135deg,#ffd166,#ff9d3c);padding:3px 14px;border-radius:999px}
.pname{font-size:38px;font-weight:900;color:var(--gold);
  text-shadow:0 0 26px rgba(255,209,102,.55);letter-spacing:.08em}
.pverdict{margin-top:4px;font-size:14px;color:var(--ink);font-weight:700}
.spec{margin:14px 2px 4px;text-align:left}
.specrow{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:13px;font-weight:800}
.sbar{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.sfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#c9861a,#ffd166);
  box-shadow:0 0 10px rgba(255,209,102,.5);transform-origin:left;animation:sw 1s .3s both}
@keyframes sw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.radarWrap{display:flex;gap:14px;align-items:center;margin-top:8px;text-align:left}
#rcv{width:132px;height:132px;flex:none}
.dl{flex:1;font-size:12px;line-height:2}
.dl b{font-weight:800}.dl i{font-style:normal;font-variant-numeric:tabular-nums;font-weight:900}
.breplay{margin-top:10px;padding:12px 14px;text-align:left;font-size:12.5px;line-height:1.9;color:var(--dim)}
.breplay b{color:var(--ink)}
.breplay .tt{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:900;display:block;margin-bottom:4px}
.reco{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rc{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:13px;text-align:left;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);font-size:13px;line-height:1.6}
.rc .ic{font-size:17px}
.rc b{color:var(--gold);margin-right:6px}
.fin{margin-top:10px;font-size:14px;font-weight:800;color:var(--dim)}
.fin i{font-style:normal;font-variant-numeric:tabular-nums}
.posT{color:var(--up)}.negT{color:var(--down)}
.toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:66;
  padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;color:#1a1200;
  background:linear-gradient(135deg,#ffd166,#ff9d3c);box-shadow:0 8px 24px rgba(255,209,102,.4);
  animation:tin 2.4s both;pointer-events:none}
@keyframes tin{0%{opacity:0;transform:translate(-50%,14px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,6,11,.78);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:22px}
.mcard{max-width:380px;width:100%;border-radius:18px;padding:20px;
  background:linear-gradient(165deg,#141a2c,#0b0f1a);border:1px solid rgba(255,209,102,.4);
  box-shadow:0 0 40px rgba(255,209,102,.15)}
.mt{font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:900}
.mname{font-size:24px;font-weight:900;margin:6px 0 10px}
.mtask{font-size:14px;line-height:1.9;color:var(--ink)}
.mnote{margin-top:12px;font-size:11.5px;color:var(--dim);line-height:1.7}
#poster{width:100%;border-radius:14px;display:block}
/* 矮屏适配（iPhone SE 等）：确保图表+问题+选项一屏完整可见 */
@media (max-height:640px){
  #kcv{height:100px}
  .drama{font-size:12px;line-height:1.55;padding:9px 12px;margin:0 8px 9px}
  .chartHead{padding:10px 12px 4px}
  .q{font-size:16px}
  .opt{padding:11px 14px;font-size:14px}
  #stage{gap:9px;padding-top:calc(env(safe-area-inset-top) + 8px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>
<div id="fx"></div>
<div id="danmaku"></div>
<canvas id="confetti"></canvas>
<div id="stage"></div>

<script>
"use strict";
/* ================= 数据 ================= */
const DIMS=["risk","discipline","emotion","patience","independence","adapt"];
const DIMCN={risk:"风险承受",discipline:"纪律执行",emotion:"情绪稳定",patience:"耐心长线",independence:"独立判断",adapt:"复盘适应"};
const PERSONAS=[
 {name:"激进猎手",vec:{risk:2,discipline:-1,emotion:-1,patience:-2,independence:2,adapt:0},
  verdict:"仓位即信仰，效率即正义",strength:"敢出手、反应快、独立判断",weak:"回撤容易失控，耐心是短板",
  reco:["高波动/事件驱动因子模板 + 敞口控制","《仓位管理》课","挑战副本：最大回撤≤15%的激进组合"],
  task:"用一段你亲手扛过的回撤，在因子中心写一个「回撤期防御因子」。目标：最大回撤 ≤ 15%，收益不输你的直觉盘。"},
 {name:"谨慎守城者",vec:{risk:-2,discipline:2,emotion:2,patience:2,independence:0,adapt:1},
  verdict:"先活下来，再谈收益",strength:"纪律强、心态稳、有耐心",weak:"收益弹性不足，容易踏空",
  reco:["低波质量/红利因子模板","《收益增强》课","挑战副本：同等风险下收益+20%"],
  task:"在 Qube 用一句话生成一个低波红利组合。挑战：同等风险下收益 +20%，把「稳」变成进攻。"},
 {name:"情绪追风者",vec:{risk:1,discipline:-2,emotion:-2,patience:-2,independence:-2,adapt:-1},
  verdict:"追的不是涨，是心跳",strength:"市场嗅觉灵、行动力强",weak:"情绪驱动、缺少止损纪律",
  reco:["规则化止盈止损模板（Qube一句话生成）","《行为金融偏误》课","7天纪律挑战"],
  task:"7天纪律挑战：每天用 Qube 生成一条带硬止损的交易计划并严格执行。第 7 天回来对比：你的「感觉」胜率到底有多少。"},
 {name:"系统量化派",vec:{risk:0,discipline:2,emotion:1,patience:0,independence:1,adapt:2},
  verdict:"感觉会骗人，信号不会",strength:"系统化执行、持续复盘",weak:"过度依赖信号，灵活度不足",
  reco:["回测沙箱 + 因子中心因子池","《高阶因子挖掘》课","画像→专属因子任务卡→报名第四届因子大赛"],
  task:"直接开工：把你的交易规则写成因子，提交第四届 PandaAI 因子大赛（全年奖池 120 万，随到随赛）。"},

const SFX={ctx:null,muted:false,
 init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}},
 b(f,d,type,g,when){if(!this.ctx||this.muted)return;try{
   const t=this.ctx.currentTime+(when||0);const o=this.ctx.createOscillator(),v=this.ctx.createGain();
   o.type=type||"sine";o.frequency.value=f;v.gain.setValueAtTime(g||.05,t);
   v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(this.ctx.destination);
   o.start(t);o.stop(t+d);}catch(e){}},
 tap(){this.b(660,.06,"square",.03)},
 tick(){this.b(1250,.03,"square",.025)},
 win(){this.b(880,.09,"sine",.06);this.b(1318,.14,"sine",.05,.07)},
 badge(){[784,988,1319].forEach((f,i)=>this.b(f,.12,"triangle",.05,i*.07))},
 loss(){this.b(170,.2,"sawtooth",.05)},
 reveal(){[523,659,784,1046].forEach((f,i)=>this.b(f,.3,"sine",.045,i*.09))}
};

function confetti(){const cv=$("#confetti"),ctx=cv.getContext("2d");
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";ctx.scale(devicePixelRatio,devicePixelRatio);
  const W2=innerWidth,H2=innerHeight;
  const cs=["#ffd166","#ff3b5c","#00e676","#8b7bff","#ffffff"];
  const ps=Array.from({length:130},()=>({x:W2/2+rnd(-60,60),y:H2*.24+rnd(-20,20),
    vx:rnd(-5.5,5.5),vy:rnd(-9,-3),g:.22,s:rnd(3,7),c:cs[Math.floor(rnd(0,cs.length))],
    r:rnd(0,6.28),vr:rnd(-.2,.2),life:rnd(50,95)}));
  (function loop(){ctx.clearRect(0,0,W2,H2);let alive=false;
    ps.forEach(p=>{if(p.life<=0)return;alive=true;p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;
      p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.globalAlpha=clamp(p.life/40,0,1);ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);
      ctx.fillRect(-.75,-p.s*1.05,1.5,p.s*1.45);
      ctx.restore();});
    if(alive)raf(loop);else ctx.clearRect(0,0,W2,H2);})();}

/* ================= K线渲染（辉光、入场动画、此刻标记） ================= */
function drawKline(cv,bars,anim,done){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  const pad={l:8,r:44,t:10,b:14},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  let lo=1e18,hi=-1e18;bars.forEach(b=>{lo=Math.min(lo,b[4]);hi=Math.max(hi,b[3]);});
  const sp=(hi-lo)*.08||1;lo-=sp;hi+=sp;
  const X=i=>pad.l+iw*(i+.5)/bars.length, Y=p=>pad.t+ih*(1-(p-lo)/(hi-lo));
  const cw=Math.max(2,iw/bars.length*.62);
  x.font="9px -apple-system,sans-serif";x.textBaseline="middle";
  const total=anim?1150:0;const t0=performance.now();
  function frame(now){
    const k=anim?clamp((now-t0)/total,0,1):1;
    const ease=1-Math.pow(1-k,3);const n=Math.max(1,Math.floor(bars.length*ease));
    x.clearRect(0,0,W,H);
    x.strokeStyle="rgba(255,255,255,.05)";x.fillStyle="rgba(233,237,246,.32)";
    for(let g=0;g<4;g++){const gy=pad.t+ih*g/3;const gp=hi-(hi-lo)*g/3;
      x.beginPath();x.moveTo(pad.l,gy);x.lineTo(W-pad.r,gy);x.stroke();
      x.fillText(gp.toFixed(0),W-pad.r+5,gy);}
    for(let i=0;i<n;i++){const b=bars[i];const up=b[2]>=b[1];
      const c=up?"#ff3b5c":"#00e676";x.shadowColor=c;x.shadowBlur=6;
      x.strokeStyle=c;x.fillStyle=c;x.lineWidth=1.4;
      x.beginPath();x.moveTo(X(i),Y(b[3]));x.lineTo(X(i),Y(b[4]));x.stroke();
      const y1=Y(Math.max(b[1],b[2])),y2=Y(Math.min(b[1],b[2]));
      x.fillRect(X(i)-cw/2,y1,cw,Math.max(1.6,y2-y1));}
    x.shadowBlur=0;
    if(k>=1){ /* 此刻 */
      const i=bars.length-1,yy=Y(bars[i][2]);
      x.strokeStyle="rgba(255,209,102,.55)";x.setLineDash([3,4]);
      x.beginPath();x.moveTo(X(i),pad.t);x.lineTo(X(i),H-pad.b);x.stroke();x.setLineDash([]);
      x.fillStyle="#ffd166";x.shadowColor="#ffd166";x.shadowBlur=10;
      x.beginPath();x.arc(X(i),yy,3.4,0,7);x.fill();x.shadowBlur=0;
      x.fillStyle="#ffd166";x.fillText("此刻",X(i)-10,yy-11);
      x.fillRect(X(i)-56,yy+6,50,15);
      x.fillStyle="#1a1200";x.font="900 10px -apple-system,sans-serif";
      x.fillText(bars[bars.length-1][2].toFixed(0),X(i)-50,yy+14);
      if(done)done();return;
    }
    raf(frame);
  }
  raf(frame);
}

/* ================= 雷达图 ================= */
function paintRadar(x,cx,cy,R,vals){const N=6;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  x.strokeStyle="rgba(255,255,255,.14)";x.lineWidth=1;
  [1,.66,.33].forEach(f=>{x.beginPath();for(let i=0;i<=N;i++){const p=pt(i%N,R*f);
    i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}x.stroke();});
  for(let i=0;i<N;i++){const p=pt(i,R);x.beginPath();x.moveTo(cx,cy);x.lineTo(p[0],p[1]);x.stroke();}
  x.beginPath();for(let i=0;i<=N;i++){const r=R*vals[i%N];const p=pt(i%N,r);
    i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}
  x.closePath();x.fillStyle="rgba(255,209,102,.2)";x.fill();
  x.shadowColor="#ffd166";x.shadowBlur=8;x.strokeStyle="#ffd166";x.lineWidth=1.8;x.stroke();x.shadowBlur=0;
  x.fillStyle="rgba(233,237,246,.72)";x.font="9.5px -apple-system,sans-serif";
  x.textAlign="center";x.textBaseline="middle";
  for(let i=0;i<N;i++){const p=pt(i,R+13);x.fillText(DIMCN[DIMS[i]],p[0],p[1]);}
}
function drawRadar(cv,vals,size){const dpr=devicePixelRatio||1;
  cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+"px";cv.style.height=size+"px";
  const x=cv.getContext("2d");x.scale(dpr,dpr);
  paintRadar(x,size/2,size/2,size/2-22,vals);}

function drawEquityCurve(cv,hist){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  const lo=Math.min(...hist),hi=Math.max(...hist),sp=(hi-lo)||1,pad=6;
  const X=i=>pad+(W-2*pad)*i/(hist.length-1),Y=v=>H-pad-(H-2*pad)*(v-lo)/sp;
  x.strokeStyle="rgba(255,255,255,.12)";x.setLineDash([3,4]);
  x.beginPath();x.moveTo(0,Y(100000));x.lineTo(W,Y(100000));x.stroke();x.setLineDash([]);
  x.beginPath();hist.forEach((v,i)=>{i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});
  x.lineTo(X(hist.length-1),H);x.lineTo(X(0),H);x.closePath();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(255,209,102,.26)");g.addColorStop(1,"rgba(255,209,102,0)");
  x.fillStyle=g;x.fill();
  x.beginPath();hist.forEach((v,i)=>{i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});
  x.strokeStyle="#ffd166";x.lineWidth=2;x.shadowColor="#ffd166";x.shadowBlur=8;x.stroke();x.shadowBlur=0;
  [0,hist.length-1].forEach(i=>{x.fillStyle=i?"#ffd166":"rgba(233,237,246,.65)";
    x.beginPath();x.arc(X(i),Y(hist[i]),3,0,7);x.fill();});
  x.fillStyle="rgba(233,237,246,.5)";x.font="9px -apple-system,sans-serif";x.textBaseline="bottom";
  x.fillText("本金 100,000",4,Math.max(9,Y(100000)-3));
}

/* ================= 引擎 ================= */
function accumulate(profile,delta){DIMS.forEach(d=>{profile[d]=(profile[d]||0)+(delta[d]||0);});}
function classify(profile){
  const mp=Math.max(1,...DIMS.map(d=>Math.abs(profile[d]||0)));
  const p=DIMS.map(d=>(profile[d]||0)/mp);
  const ranked=PERSONAS.map(pr=>{
    const mv=Math.max(...DIMS.map(d=>Math.abs(pr.vec[d])));
    const c=DIMS.map(d=>pr.vec[d]/mv);
    const dist=Math.sqrt(DIMS.reduce((s,d,i)=>s+(p[i]-c[i])**2,0));
    return{pr,dist};}).sort((a,b)=>a.dist-b.dist);
  const exps=ranked.map(r=>Math.exp(-2.2*r.dist));
  const sum=exps.reduce((a,b)=>a+b,0);
  ranked.forEach((r,i)=>r.w=exps[i]/sum);
  return ranked;
}

  later(open,FAST?900:2500);
}

function buildDecision(i){
  choosing=false;
  const n=NODES[i];const box=$("#decide");if(!box)return;
  box.innerHTML=`<div class="pop">
    <div class="qrow"><div class="q">${n.q}</div>
      <div class="ringbox" id="rb">
        <svg class="ring" viewBox="0 0 64 64">
          <circle class="rbg" cx="32" cy="32" r="26"></circle>
          <circle class="rfg" id="rfg" cx="32" cy="32" r="26"></circle></svg>
        <div class="rsec" id="rsec">18</div></div></div>
    <div class="opts">${n.o.map((o,j)=>
      `<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span>${o[0]}</button>`).join("")}</div>
    <div class="combo" id="combo">${S.combo>=2?`纪律连击 ×${S.combo}`:""}</div></div>`;
  danmaku(n.dm,4);
  const C=163.36,T=FAST?8:18;let left=T;
  const fg=$("#rfg"),rb=$("#rb"),rs=$("#rsec");
  fg.style.strokeDashoffset=0;
  cdIv=setInterval(()=>{left--;
    if(left<=0){clearInterval(cdIv);timedOut(i);return;}
    rs.textContent=left;
    fg.style.strokeDashoffset=C*(1-left/T);
    if(left<=6){rb.classList.add("hot");SFX.tick();}
  },1000);
  rs.textContent=T;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(i,+b.dataset.j,false));
}

function timedOut(i){toast("超时 —— 本能替你做了选择");choose(i,NODES[i].def,true);}

let choosing=false,cdIv=null;
function choose(i,j,timeout){
  if(choosing)return;choosing=true;
  if(cdIv)clearInterval(cdIv);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(+b.dataset.j===j){b.style.borderColor="var(--gold)";}
    else{b.style.opacity=.45;}});
  const n=NODES[i],label=n.o[j][0],delta=n.o[j][1],pnlR=n.o[j][2];
  SFX.tap();
  /* 画像累积 */
  accumulate(S.profile,delta);
  S.choices.push({tag:n.tag,label,node:n.id,j,delta});
  /* 连击 */
  if((delta.discipline||0)>0){S.combo++;}else if((delta.discipline||0)<0){S.combo=0;}
  S.equityHist.push(S.equity);drawSpark();
  /* 盈亏演出 */
  if(pnlR[1]>0||pnlR[0]<0){
    const pct=pnlR[0]===pnlR[1]?pnlR[0]:rnd(pnlR[0],pnlR[1]);
    const amt=Math.round(S.equity*pct/100);
    const old=S.equity;S.equity=Math.max(1000,S.equity+amt);
    S.choices[S.choices.length-1].pnl=+pct.toFixed(1);
    const good=amt>=0;
    floatNum((good?"+":"-")+fmt(Math.abs(amt)).slice(2),good?"pos":"neg");
    flash(good?"flashUp":"flashDown");
    good?SFX.win():SFX.loss();
    if(amt<-8000){shake();vibrate([60,40,60]);}else vibrate(35);
    rollEquity(old,S.equity);
  }else{
    const gained=[3,1,0][j];
    floatNum("+"+gained+" 复盘经验","xp");
  }
  if(S.combo>=2){const c=$("#combo");if(c){c.textContent=`纪律连击 ×${S.combo}`;c.classList.add("pop");}}
  checkBadges();
  saveS();
  later(()=>{i+1<NODES.length?showLevel(i+1):results();},FAST?900:1500);
}

/* ================= 屏幕：结算 ================= */
function results(){
  clearAll();
  const ranked=classify(S.profile);
  const dom=ranked[0].pr,second=ranked[1].pr;
  const scores={};DIMS.forEach(d=>scores[d]=dimScore(S.profile[d]||0));
  const vals=DIMS.map(d=>(scores[d]-2)/97);
  const pct=(S.equity/100000-1)*100;
  const picks=[S.choices[1],S.choices[2],S.choices[S.choices.length-1]].filter(Boolean);
  stage().innerHTML=topbar(NODES.length,NODES.length)+`
  <div class="reveal"><div class="pcard">
    <div class="rarity">PERSONA · 交易人格</div>
    <div class="pname">${dom.name}</div>
    <div class="stars">★ ★ ★</div>
    <div class="pverdict">「${dom.verdict}」</div>
    <div class="spec">
      <div class="specrow"><span style="width:8.2em">${dom.name}</span>
        <div class="sbar"><div class="sfill" style="width:${Math.round(ranked[0].w*100)}%"></div></div>
        <span>${Math.round(ranked[0].w*100)}%</span></div>
      <div class="specrow" style="color:var(--dim)"><span style="width:8.2em">${second.name}</span>
        <div class="sbar" style="opacity:.55"><div class="sfill" style="width:${Math.round(ranked[1].w*100)}%"></div></div>
        <span>${Math.round(ranked[1].w*100)}%</span></div>
    </div>
    <div class="radarWrap"><canvas id="rcv"></canvas>
      <div class="dl">${DIMS.map(d=>`<div><b>${DIMCN[d]}</b> <i class="${scores[d]>=60?"posT":scores[d]<=40?"negT":""}">${scores[d]}</i></div>`).join("")}</div></div>
    <div class="breplay"><span class="tt">关键行为还原</span>
      ${picks.map(p=>`· <b>${p.tag}</b>：你选择了「${p.label}」<br>`).join("")}</div>
    <div class="badges">${S.badges&&S.badges.length?S.badges.map(b=>`<span class="bdg">🏅 ${b}</span>`).join(""):`<span class="bdg dim">本局未解锁徽章 —— 下一局试着拿下「铁血纪律」</span>`}</div>
    <div class="serial">No.${String(1000+Math.floor(Math.random()*9000))} · SEASON 1 · 本场第 ${S.equityHist.length} 次抉择</div>
  </div></div>
  <div class="card fadeUp ending">
    <div class="et">${pct>=30?"🔥 财富自由（模拟盘版）":pct>=10?"🏆 稳健赢家":pct>=-10?"🌱 市场新生":pct>=-30?"🍜 韭菜毕业":"💀 关灯吃面（模拟的）"}</div>
    <div class="ed">${pct>=30?"这局你是传说。下一局，市场会记住你。":pct>=10?"这条收益曲线，比不少基金经理都体面。":pct>=-10?"学费没交多少，故事倒是攒了一堆。":pct>=-30?"关灯吃面之前，先把这份人格报告吃了。":"别难过——虚拟盘亏掉的钱，攒下的是真经验。"}</div>
  </div>
  <div class="card fadeUp" style="padding:14px">
    <canvas id="ecv" class="ecv"></canvas>
    <div class="fin">账户终值 <i>${fmt(S.equity)}</i>（<i class="${pct>=0?"posT":"negT"}">${pct>=0?"+":""}${pct.toFixed(1)}%</i>）</div>
    <div class="vsline" id="vsline"></div>
    <div class="reco">
      <div class="rc"><span class="ic">🛠</span><span><b>工具</b>${dom.reco[0]}</span></div>
      <div class="rc"><span class="ic">📚</span><span><b>内容</b>${dom.reco[1]}</span></div>
      <div class="rc"><span class="ic">🎯</span><span><b>挑战</b>${dom.reco[2]}</span></div></div>
  </div>
  <button class="btn gold" id="task">领取专属因子任务卡 →</button>
  <button class="btn" id="posterBtn">生成分享海报</button>
  <button class="btn ghost" id="again">再战一局（换一种活法）</button>
  <div class="disc">人格光谱由 8 次决策行为计算 · 优势：${dom.strength}｜盲区：${dom.weak}<br>虚拟资金 · 教育用途 · 不构成任何投资建议</div>`;
  bindMute();
  stage().style.setProperty("--mood","#ffd166");setAtmo("#ffd166");
  drawRadar($("#rcv"),vals,132);
  drawSpark();drawEquityCurve($("#ecv"),S.equityHist);
  /* 全场实时对比：调服务器遥测聚合（本地/离线时静默隐藏） */
  fetch("api/stats").then(r=>r.json()).then(d=>{
    if(!d||!d.total||d.total<2)return;
    const el=document.querySelector("#vsline");if(!el)return;
    const eqs=(d.top||[]).map(t=>t.e);
    const my=S.equity;
    if(eqs.length&&my>=eqs[0]){
      el.textContent=`⚡ 全场第一 · 击败 ${d.total-1}/${d.total-1} 位玩家`;
    }else{
      const better=eqs.filter(e=>my>e).length;
      if(better>0){
        el.textContent=`⚡ 全场第 ${better+1} 名 · 击败 ${Math.round((d.total-better-1)/Math.max(1,d.total-1)*100)}% 玩家`;
      }else{
        const diff=Math.round((my-d.avgEquity)/Math.max(1,d.avgEquity)*100);
        el.textContent=`⚡ ${diff>=0?"高于":"低于"}全场平均收益 ${Math.abs(diff)}% —— 下一局翻盘`;
      }
    }
  }).catch(()=>{});
  SFX.reveal();confetti();vibrate([40,60,40]);
  /* 现场埋点（无服务器时静默失败，不影响游戏） */
  try{fetch("api/report",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({persona:dom.name,top:Math.round(ranked[0].w*100),
      equity:S.equity,dims:S.profile,acts:NODES.length})}).catch(()=>{});}catch(e){}
  try{localStorage.removeItem(KEY);}catch(e){}
  $("#task").onclick=()=>taskCard(dom);
  $("#posterBtn").onclick=()=>posterView(dom,ranked,scores,pct);
  $("#again").onclick=()=>intro();
}

function taskCard(dom){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="mcard pop"><div class="mt">SPECIAL FACTOR QUEST</div>
    <div class="mname">${dom.name} · 专属因子任务卡</div>
    <div class="mtask">${dom.task}</div>
    <div class="mnote">携带这张卡去 PandaAI：量化因子中心可以直接开写；第四届因子大赛全年奖池 120 万，随到随赛。<br>本卡由你的 8 次决策行为生成 —— 它比问卷更懂你。</div>
    <button class="btn gold" style="margin-top:14px" id="mclose">收下，去开工</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#mclose").onclick=()=>m.remove();
  SFX.win();
}

/* ================= 分享海报 ================= */
function posterView(dom,ranked,scores,pct){
  const W=750,H=1334;const cv=document.createElement("canvas");
  cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#141026");g.addColorStop(.5,"#0b0f1c");g.addColorStop(1,"#1a0d16");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="rgba(255,59,92,.16)";x.beginPath();x.arc(640,180,240,0,7);x.fill();
  x.fillStyle="rgba(139,123,255,.14)";x.beginPath();x.arc(90,760,220,0,7);x.fill();
  /* 顶部K线装饰 */
  let px=1020;for(let i=0;i<26;i++){const o=px,c=px+rnd(-26,26);px=c;
    const up=c>=o,col=up?"#ff3b5c":"#00e676";
    x.strokeStyle=col;x.globalAlpha=.55;x.lineWidth=3;
    x.beginPath();x.moveTo((i+1)*28,96+rnd(0,30));x.lineTo((i+1)*28,146+rnd(0,30));x.stroke();
    x.fillStyle=col;x.fillRect((i+1)*28-8,104+rnd(0,22),16,rnd(10,30));}
  x.globalAlpha=1;
  x.textAlign="center";
  x.fillStyle="rgba(233,237,246,.5)";x.font="600 22px -apple-system,sans-serif";
  x.fillText("T H E   M A R K E T   T H E A T R E",W/2,80);
  x.fillStyle="#e9edf6";x.font="900 34px -apple-system,sans-serif";
  x.fillText("我的交易人格",W/2,250);
  x.fillStyle="#ffd166";x.shadowColor="#ffd166";x.shadowBlur=30;
  x.font="900 96px -apple-system,sans-serif";x.fillText(dom.name,W/2,370);x.shadowBlur=0;
  x.fillStyle="#e9edf6";x.font="700 30px -apple-system,sans-serif";
  x.fillText("「"+dom.verdict+"」",W/2,436);
  /* 雷达 */
  const vals=DIMS.map(d=>(scores[d]-2)/97);
  paintRadar(x,W/2,560,105,vals);
  x.fillStyle="rgba(233,237,246,.85)";x.font="700 24px -apple-system,sans-serif";
  x.fillText(DIMS.slice(0,3).map(d=>DIMCN[d]+" "+scores[d]).join("    "),W/2,712);
  x.fillText(DIMS.slice(3).map(d=>DIMCN[d]+" "+scores[d]).join("    "),W/2,754);
  x.fillStyle="rgba(233,237,246,.6)";x.font="600 24px -apple-system,sans-serif";
  x.fillText("账户终值 "+fmt(S.equity)+"（"+(pct>=0?"+":"")+pct.toFixed(1)+"%）",W/2,810);
  /* 行为金句 */
  const picks=[S.choices[1],S.choices[2]].filter(Boolean);
  x.fillStyle="rgba(255,209,102,.9)";x.font="800 24px -apple-system,sans-serif";
  x.fillText("关键行为还原",W/2,858);
  x.fillStyle="rgba(233,237,246,.75)";x.font="500 22px -apple-system,sans-serif";
  picks.forEach((p,i)=>x.fillText(p.tag+" · "+p.label,W/2,900+i*40));
  /* 光谱 */
  x.fillStyle="#ffd166";x.font="800 26px -apple-system,sans-serif";
  x.fillText(ranked[0].pr.name+" "+Math.round(ranked[0].w*100)+"% × "+
    ranked[1].pr.name+" "+Math.round(ranked[1].w*100)+"%",W/2,996);
  x.fillStyle="rgba(233,237,246,.85)";x.font="700 22px -apple-system,sans-serif";
  x.fillText("结局 · "+(pct>=30?"🔥 财富自由":pct>=10?"🏆 稳健赢家":pct>=-10?"🌱 市场新生":pct>=-30?"🍜 韭菜毕业":"💀 关灯吃面"),W/2,1048);
  x.fillStyle="#ffd166";x.font="600 20px -apple-system,sans-serif";
  x.fillText((S.badges||[]).slice(0,3).map(b=>"🏅 "+b).join("   ")||"🏅 下一局解锁你的徽章",W/2,1082);
  /* 二维码占位 */
  x.strokeStyle="rgba(255,209,102,.6)";x.lineWidth=3;
  roundRect(x,W/2-90,1104,180,180,18);x.stroke();
  x.fillStyle="rgba(233,237,246,.4)";x.font="500 20px -apple-system,sans-serif";
  x.fillText("二维码位",W/2,1200);
  x.fillStyle="rgba(233,237,246,.5)";x.font="600 22px -apple-system,sans-serif";
  x.fillText("行情剧场 · 交易人格试炼",W/2,1308);
  x.fillStyle="rgba(233,237,246,.28)";x.font="400 16px -apple-system,sans-serif";
  x.fillText("虚拟资金 · 教育用途 · 不构成投资建议",W/2,1330);
  const url=cv.toDataURL("image/png");
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="mcard pop" style="max-width:340px;max-height:92vh;overflow:auto">
    <img id="poster" alt="分享海报" src="${url}">
    <button class="btn gold" style="margin-top:12px" id="dl">保存 / 分享海报</button>
    <div class="mnote" style="text-align:center">iOS 长按图片亦可保存 · 二维码位待替换</div>
    <button class="btn ghost" style="margin-top:8px" id="pclose">关闭</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#dl").onclick=()=>{const a=document.createElement("a");
    a.href=url;a.download="行情剧场-交易人格.png";a.click();};
  m.querySelector("#pclose").onclick=()=>m.remove();
  SFX.win();
}
function roundRect(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);
  x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}

/* 全局兜底：任何未捕获异常 → 轻提示（断点续玩已就位，刷新即恢复） */
window.addEventListener("error",()=>{try{
  if(document.querySelector(".toast"))return;
  toast("出了点小状况——刷新即可从上次进度继续");
}catch(e){}});

/* ================= 启动 ================= */
function newGame(){S={step:0,profile:{},equity:100000,choices:[],combo:0,badges:[],equityHist:[100000]};showLevel(0);}
let curFull=!!store("hq_mode_full");
setMode(curFull);
setAtmo("#ffd166");
intro();
</script>
